<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="t d">
  <title id="t">How a message gets checked</title>
  <desc id="d">Messages arrive as forwarded texts, voicemails, screenshots, or automatically from the Android app. Links, numbers and amounts are pulled out; four evidence checks run at once; Claude weighs the text and the evidence; the final score (93 percent, HIGH, in this example) triggers a reply and, if linked, a guardian alert.</desc>
  <defs><!--INJECT--></defs>

  <rect width="1000" height="630" rx="20" fill="#0b1220"/>
  <text x="28" y="66" font-size="32" class="title">How a message gets checked</text>
  <text x="28" y="98" font-size="17" class="lead">One scam text, followed through each step. What each step found is in color.</text>

  <!-- step headers -->
  <g font-size="16" class="name">
    <circle cx="41" cy="146" r="13" fill="#a9b6ca"/><text x="41" y="151.5" text-anchor="middle" style="fill:#0b1220;font-weight:800;font-size:14px">1</text>
    <text x="62" y="152">Comes in</text>
    <circle cx="226" cy="146" r="13" fill="#a9b6ca"/><text x="226" y="151.5" text-anchor="middle" style="fill:#0b1220;font-weight:800;font-size:14px">2</text>
    <text x="247" y="152">Extract</text>
    <circle cx="445" cy="146" r="13" fill="#a9b6ca"/><text x="445" y="151.5" text-anchor="middle" style="fill:#0b1220;font-weight:800;font-size:14px">3</text>
    <text x="466" y="152">Evidence</text>
    <circle cx="638" cy="146" r="13" fill="#b9a5ff"/><text x="638" y="151.5" text-anchor="middle" style="fill:#0b1220;font-weight:800;font-size:14px">4</text>
    <text x="659" y="152">Judge</text>
    <circle cx="821" cy="146" r="13" fill="#f87171"/><text x="821" y="151.5" text-anchor="middle" style="fill:#0b1220;font-weight:800;font-size:14px">5</text>
    <text x="842" y="152">Decide</text>
  </g>

  <!-- wires -->
  <path class="wire" d="M190 204 C203 204 200 312 211 312" marker-end="url(#arrow)"/>
  <path class="wire" d="M190 280 C203 280 200 312 211 312"/>
  <path class="wire" d="M190 356 C203 356 200 312 211 312"/>
  <path class="wire" d="M190 432 C203 432 200 312 211 312"/>
  <path class="wire" d="M409 312 C422 312 418 204 430 204" marker-end="url(#arrow)"/>
  <path class="wire" d="M409 312 C422 312 418 280 430 280" marker-end="url(#arrow)"/>
  <path class="wire" d="M409 312 C422 312 418 356 430 356" marker-end="url(#arrow)"/>
  <path class="wire" d="M409 312 C422 312 418 432 430 432" marker-end="url(#arrow)"/>
  <path class="wire" d="M602 204 C615 204 611 320 623 320" marker-end="url(#arrow)"/>
  <path class="wire" d="M602 280 C615 280 611 320 623 320"/>
  <path class="wire" d="M602 356 C615 356 611 320 623 320"/>
  <path class="wire" d="M602 432 C615 432 611 320 623 320"/>
  <path class="wire" d="M785 320 C798 320 794 254 806 254" marker-end="url(#arrow)"/>
  <path class="wire" d="M890 350 L890 370" marker-end="url(#arrow)"/>
  <path class="wire" d="M890 436 L890 466" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- 1 inputs -->
  <g>
    <rect x="28" y="172" width="162" height="64" rx="12" class="card"/>
    <text x="42" y="199" font-size="16" class="name">Forwarded text</text>
    <text x="42" y="222" font-size="15" class="sub">Twilio number</text>
    <rect x="28" y="248" width="162" height="64" rx="12" class="card"/>
    <text x="42" y="275" font-size="16" class="name">Voicemail</text>
    <text x="42" y="298" font-size="15" class="sub">auto-transcribed</text>
    <rect x="28" y="324" width="162" height="64" rx="12" class="card"/>
    <text x="42" y="351" font-size="16" class="name">Screenshot</text>
    <text x="42" y="374" font-size="15" class="sub">read by Claude</text>
    <rect x="28" y="400" width="162" height="64" rx="12" fill="#12271f" stroke="#2f6b4f"/>
    <text x="42" y="427" font-size="16" class="name">Android app</text>
    <text x="42" y="450" font-size="15" class="sub" style="fill:#a7d7bd">unknown numbers</text>
  </g>

  <!-- 2 extract -->
  <g>
    <rect x="213" y="228" width="196" height="168" rx="12" class="card"/>
    <text x="227" y="257" font-size="16" class="name">Pull out</text>
    <text x="227" y="283" font-size="15" class="body">• links, domains</text>
    <text x="227" y="305" font-size="15" class="body">• phone numbers</text>
    <text x="227" y="327" font-size="15" class="body">• money amounts</text>
    <line x1="227" y1="344" x2="395" y2="344" stroke="#2a3850"/>
    <text x="227" y="366" font-size="15" class="amber" style="font-weight:600">ezpass-tollpay.com</text>
    <text x="227" y="386" font-size="15" class="amber" style="font-weight:600">$4.15</text>
  </g>

  <!-- 3 evidence -->
  <g>
    <rect x="432" y="172" width="170" height="64" rx="12" class="card"/>
    <text x="446" y="199" font-size="16" class="name">Pattern rules</text>
    <text x="446" y="222" font-size="15" class="amber" style="font-weight:600">scam wording</text>
    <rect x="432" y="248" width="170" height="64" rx="12" class="card"/>
    <text x="446" y="275" font-size="16" class="name">Lookalike</text>
    <text x="446" y="298" font-size="15" class="red" style="font-weight:600">imitates E-ZPass</text>
    <rect x="432" y="324" width="170" height="64" rx="12" class="card"/>
    <text x="446" y="351" font-size="16" class="name">Domain age</text>
    <text x="446" y="374" font-size="15" class="red" style="font-weight:600">3 days old</text>
    <rect x="432" y="400" width="170" height="64" rx="12" class="card"/>
    <text x="446" y="427" font-size="16" class="name">Blocklists</text>
    <text x="446" y="450" font-size="15" class="sub">not listed yet</text>
    <text x="517" y="494" font-size="15" class="sub" text-anchor="middle">all four run at once</text>
  </g>

  <!-- 4 claude -->
  <g>
    <rect x="625" y="196" width="160" height="248" rx="14" fill="#1c1833" stroke="#b9a5ff" stroke-width="1.5"/>
    <text x="639" y="225" font-size="16" class="name">Claude</text>
    <text x="639" y="251" font-size="15" class="body">weighs the text</text>
    <text x="639" y="272" font-size="15" class="body">and evidence,</text>
    <text x="639" y="293" font-size="15" class="body">ignores orders</text>
    <text x="639" y="314" font-size="15" class="body">hidden in it</text>
    <line x1="639" y1="332" x2="771" y2="332" stroke="#3b3360"/>
    <text x="639" y="358" font-size="14" class="mono">risk<tspan x="690" class="red">0.93</tspan></text>
    <text x="639" y="382" font-size="14" class="mono">type<tspan x="690" class="purple">toll scam</tspan></text>
    <text x="639" y="406" font-size="14" class="mono">flags<tspan x="690">3</tspan></text>
  </g>

  <!-- 5 decide -->
  <g>
    <rect x="808" y="172" width="164" height="178" rx="14" fill="#2a1518" stroke="#f87171" stroke-width="1.5"/>
    <text x="822" y="201" font-size="16" class="name">Final score</text>
    <text x="822" y="225" font-size="15" class="sub" style="fill:#d8b4b4">40% evidence</text>
    <text x="822" y="245" font-size="15" class="sub" style="fill:#d8b4b4">60% Claude</text>
    <text x="820" y="300" font-size="38" class="red" style="font-weight:800;letter-spacing:-0.02em">93%</text>
    <rect x="822" y="312" width="56" height="24" rx="12" fill="#f87171"/>
    <text x="850" y="329" font-size="13" text-anchor="middle" style="fill:#2a1518;font-weight:800;letter-spacing:0.06em">HIGH</text>

    <rect x="808" y="372" width="164" height="64" rx="12" class="card"/>
    <text x="822" y="399" font-size="16" class="name">Reply or alert</text>
    <text x="822" y="422" font-size="15" class="sub">SMS or phone</text>

    <rect x="808" y="468" width="164" height="64" rx="12" fill="#2a2412" stroke="#a37b1a"/>
    <text x="822" y="495" font-size="16" class="name">Guardian alert</text>
    <text x="822" y="518" font-size="15" class="sub" style="fill:#d9c89a">if linked, ≥ 80%</text>
  </g>

  <text x="28" y="590" font-size="15" class="sub">Blocklists can miss brand-new scam sites. That's why domain age and lookalike checks matter.</text>
</svg>
