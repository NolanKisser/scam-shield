<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
  <title id="t">Scam Shield</title>
  <desc id="d">Scam Shield catches scam texts before you tap the link. A phone shows a fake E-ZPass toll text with a warning on top: possible scam, high risk, 93 percent.</desc>
  <defs>
    <!--INJECT-->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141e38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="600" height="600" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="300" cy="400" r="260" fill="url(#glow)"/>

    <text x="38" y="96" font-size="58" class="title" style="font-weight:800;letter-spacing:-0.035em">Scam Shield</text>
    <text x="40" y="146" font-size="26" class="name">Catches scam texts</text>
    <text x="40" y="180" font-size="26" class="name">before you tap the link.</text>

    <!-- phone -->
    <rect x="135" y="222" width="330" height="460" rx="48" fill="#05080f" stroke="#3b4a63" stroke-width="3"/>
    <rect x="149" y="236" width="302" height="440" rx="36" fill="#0f172a"/>
    <rect x="270" y="249" width="60" height="8" rx="4" fill="#1e293b"/>

    <rect x="163" y="272" width="274" height="136" rx="16" fill="#1f2937" stroke="#f87171" stroke-width="2"/>
    <circle cx="190" cy="301" r="14" fill="#f87171"/>
    <rect x="188" y="292" width="4" height="12" rx="2" fill="#1f2937"/>
    <circle cx="190" cy="309" r="2.3" fill="#1f2937"/>
    <text x="214" y="300" font-size="21" class="name" style="font-weight:700">Possible scam</text>
    <text x="214" y="322" font-size="16" class="sub">+1 (202) 555-0143</text>
    <text x="181" y="360" font-size="20" class="red" style="font-weight:800;letter-spacing:0.02em">HIGH RISK · 93%</text>
    <text x="181" y="390" font-size="17" class="body">Don't tap the link.</text>

    <rect x="163" y="428" width="252" height="146" rx="22" fill="#334155"/>
    <g font-size="18" class="body" style="fill:#e5e7eb">
      <text x="183" y="462">E-ZPass: unpaid toll</text>
      <text x="183" y="488">balance of $4.15.</text>
      <text x="183" y="514">Pay today to avoid a fee:</text>
    </g>
    <text x="183" y="544" font-size="17" style="fill:#93c5fd">ezpass-tollpay.com/pay</text>
    <path d="M183 552 q4 -4 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#f87171" stroke-width="2"/>
  </g>
</svg>
