<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img" aria-labelledby="t d">
  <title id="t">How the risk score is calculated</title>
  <desc id="d">Three evidence signals (0.45, 0.70 and 0.60) combine to 0.93. That is blended 40 percent evidence and 60 percent Claude for a final 93 percent, HIGH. If a scammer fools Claude into answering 5 percent, the blend falls to 40 percent, but the lookalike-domain floor lifts it to 75 percent, still HIGH.</desc>
  <defs>
    <!--INJECT-->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#3a1d22"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f87171" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="600" height="1270" rx="24" fill="#0b1220"/>
  <text x="36" y="72" font-size="36" class="title">How the risk score</text>
  <text x="36" y="114" font-size="36" class="title">is calculated</text>
  <text x="36" y="152" font-size="21" class="lead">Hard evidence sets a minimum, so the</text>
  <text x="36" y="180" font-size="21" class="lead">score holds even if the AI is fooled.</text>

  <!-- 1 -->
  <rect x="36" y="212" width="528" height="330" rx="18" fill="#111a2c" stroke="#243149"/>
  <text x="60" y="254" font-size="24" class="name" style="font-weight:700">1 · Combine the evidence</text>
  <g font-size="20">
    <text x="60" y="300" class="body">Toll-scam wording</text>
    <text x="540" y="300" text-anchor="end" class="name" style="font-weight:700">0.45</text>
    <rect x="60" y="314" width="480" height="16" rx="8" fill="#1e293b"/>
    <rect x="60" y="314" width="216" height="16" rx="8" fill="#fbbf24"/>

    <text x="60" y="374" class="body">Lookalike domain</text>
    <rect x="290" y="355" width="116" height="28" rx="14" fill="#3a1d22"/>
    <text x="348" y="375" font-size="17" text-anchor="middle" style="fill:#fca5a5;font-weight:700">floor 75%</text>
    <text x="540" y="374" text-anchor="end" class="name" style="font-weight:700">0.70</text>
    <rect x="60" y="388" width="480" height="16" rx="8" fill="#1e293b"/>
    <rect x="60" y="388" width="336" height="16" rx="8" fill="#f87171"/>

    <text x="60" y="448" class="body">Domain 3 days old</text>
    <rect x="290" y="429" width="116" height="28" rx="14" fill="#3a1d22"/>
    <text x="348" y="449" font-size="17" text-anchor="middle" style="fill:#fca5a5;font-weight:700">floor 60%</text>
    <text x="540" y="448" text-anchor="end" class="name" style="font-weight:700">0.60</text>
    <rect x="60" y="462" width="480" height="16" rx="8" fill="#1e293b"/>
    <rect x="60" y="462" width="288" height="16" rx="8" fill="#f87171"/>
  </g>
  <text x="60" y="520" font-size="20" class="mono">1 − 0.55×0.30×0.40 = <tspan class="teal" style="font-weight:700">0.93</tspan></text>

  <!-- 2 -->
  <rect x="36" y="562" width="528" height="300" rx="18" fill="#111a2c" stroke="#243149"/>
  <text x="60" y="604" font-size="24" class="name" style="font-weight:700">2 · Blend with Claude</text>
  <g font-size="16" style="font-weight:800;letter-spacing:0.08em">
    <text x="156" y="648" text-anchor="middle" class="green">LOW</text>
    <text x="324" y="648" text-anchor="middle" class="amber">MEDIUM</text>
    <text x="468" y="648" text-anchor="middle" class="red">HIGH</text>
  </g>
  <rect x="60" y="660" width="480" height="38" rx="10" fill="#1e293b"/>
  <rect x="60" y="660" width="190" height="38" rx="10" fill="#2dd4bf"/>
  <rect x="240" y="660" width="268" height="38" fill="#b9a5ff"/>
  <line x1="252" y1="652" x2="252" y2="706" stroke="#0b1220" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="396" y1="652" x2="396" y2="706" stroke="#0b1220" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="252" y="728" font-size="18" text-anchor="middle" class="sub">40%</text>
  <text x="396" y="728" font-size="18" text-anchor="middle" class="sub">70%</text>
  <text x="60" y="770" font-size="20" class="teal" style="font-weight:600">40% × evidence 0.93 = 0.37</text>
  <text x="60" y="800" font-size="20" class="purple" style="font-weight:600">60% × Claude 0.93 = 0.56</text>
  <text x="60" y="842" font-size="32" class="red" style="font-weight:800">= 93% · HIGH</text>

  <!-- 3 -->
  <rect x="36" y="882" width="528" height="352" rx="18" fill="#1a1216" stroke="#5b2a31"/>
  <text x="60" y="924" font-size="24" class="name" style="font-weight:700">3 · If a scammer fools Claude</text>
  <g font-size="20" class="body">
    <text x="60" y="964">The text claims to be official, and</text>
    <text x="60" y="992">Claude answers 5%. The blend drops</text>
    <text x="60" y="1020">to 40%, but the lookalike floor lifts</text>
    <text x="60" y="1048">it to 75%: still HIGH, still flagged.</text>
  </g>
  <rect x="60" y="1090" width="480" height="38" rx="10" fill="#1e293b"/>
  <rect x="60" y="1090" width="200" height="38" rx="10" fill="#64748b"/>
  <rect x="250" y="1090" width="10" height="38" fill="#64748b"/>
  <rect x="260" y="1090" width="160" height="38" fill="url(#hatch)"/>
  <line x1="420" y1="1078" x2="420" y2="1140" stroke="#f87171" stroke-width="3"/>
  <text x="155" y="1170" font-size="18" text-anchor="middle" class="sub">blend 40%</text>
  <text x="420" y="1170" font-size="20" text-anchor="middle" class="red" style="font-weight:700">floor → 75% HIGH</text>
</svg>
