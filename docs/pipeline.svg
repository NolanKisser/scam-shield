<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">How a message gets checked</title>
  <desc id="d">Messages arrive by forwarded text, voicemail, screenshot or Android auto-check. Links, phone numbers and amounts are extracted, four evidence collectors run in parallel, Claude judges the message plus the evidence, and the scores are blended with evidence floors to give a final verdict, a reply, and an optional guardian alert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .h1 { font-size: 28px; font-weight: 800; fill: #f1f5f9; }
      .lead { font-size: 16px; fill: #94a3b8; }
      .step { font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .num { font-size: 13px; font-weight: 800; fill: #0b1220; }
      .name { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
      .small { font-size: 12.5px; fill: #94a3b8; }
      .body { font-size: 13.5px; fill: #cbd5e1; }
      .mono { font-family: "Cascadia Code", Consolas, Menlo, monospace; font-size: 12.5px; fill: #e2e8f0; }
      .hit-red { font-size: 13px; font-weight: 600; fill: #f87171; }
      .hit-amber { font-size: 13px; font-weight: 600; fill: #fbbf24; }
      .hit-muted { font-size: 13px; font-weight: 600; fill: #64748b; }
      .big { font-size: 34px; font-weight: 800; fill: #f87171; }
      .badge { font-size: 12px; font-weight: 800; fill: #0b1220; letter-spacing: 1px; }
      .wire { fill: none; stroke: #475569; stroke-width: 1.6; }
      .card { fill: #172033; stroke: #2c3a52; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="20" fill="#0b1220"/>
  <text x="40" y="58" class="h1">How a message gets checked</text>
  <text x="40" y="86" class="lead">Following one scam text all the way through. Example values are shown in color.</text>

  <!-- Step headers -->
  <g>
    <circle cx="52" cy="128" r="12" fill="#94a3b8"/><text x="52" y="133" text-anchor="middle" class="num">1</text>
    <text x="72" y="133" class="step">Comes in</text>
    <circle cx="262" cy="128" r="12" fill="#94a3b8"/><text x="262" y="133" text-anchor="middle" class="num">2</text>
    <text x="282" y="133" class="step">Extract</text>
    <circle cx="472" cy="128" r="12" fill="#94a3b8"/><text x="472" y="133" text-anchor="middle" class="num">3</text>
    <text x="492" y="133" class="step">Collect evidence</text>
    <circle cx="742" cy="128" r="12" fill="#a78bfa"/><text x="742" y="133" text-anchor="middle" class="num">4</text>
    <text x="762" y="133" class="step">Judge</text>
    <circle cx="972" cy="128" r="12" fill="#f87171"/><text x="972" y="133" text-anchor="middle" class="num">5</text>
    <text x="992" y="133" class="step">Decide</text>
  </g>

  <!-- Wires (drawn first so boxes sit on top) -->
  <path class="wire" d="M210 195 C232 195 228 325 248 325" marker-end="url(#arrow)"/>
  <path class="wire" d="M210 281 C232 281 228 325 248 325"/>
  <path class="wire" d="M210 367 C232 367 228 325 248 325"/>
  <path class="wire" d="M210 453 C232 453 228 325 248 325"/>

  <path class="wire" d="M420 325 C442 325 438 198 458 198" marker-end="url(#arrow)"/>
  <path class="wire" d="M420 325 C442 325 438 290 458 290" marker-end="url(#arrow)"/>
  <path class="wire" d="M420 325 C442 325 438 382 458 382" marker-end="url(#arrow)"/>
  <path class="wire" d="M420 325 C442 325 438 474 458 474" marker-end="url(#arrow)"/>

  <path class="wire" d="M690 198 C712 198 708 335 728 335" marker-end="url(#arrow)"/>
  <path class="wire" d="M690 290 C712 290 708 335 728 335"/>
  <path class="wire" d="M690 382 C712 382 708 335 728 335"/>
  <path class="wire" d="M690 474 C712 474 708 335 728 335"/>

  <path class="wire" d="M920 335 C942 335 938 240 958 240" marker-end="url(#arrow)"/>
  <path class="wire" d="M1060 330 L1060 366" marker-end="url(#arrow)"/>
  <path class="wire" d="M1060 432 L1060 466" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- 1. Inputs -->
  <g>
    <rect x="40" y="160" width="170" height="70" rx="12" class="card"/>
    <text x="56" y="190" class="name">Forwarded text</text>
    <text x="56" y="212" class="small">Twilio SMS number</text>

    <rect x="40" y="246" width="170" height="70" rx="12" class="card"/>
    <text x="56" y="276" class="name">Voicemail</text>
    <text x="56" y="298" class="small">recorded + transcribed</text>

    <rect x="40" y="332" width="170" height="70" rx="12" class="card"/>
    <text x="56" y="362" class="name">Screenshot</text>
    <text x="56" y="384" class="small">Claude reads the image</text>

    <rect x="40" y="418" width="170" height="70" rx="12" fill="#13261f" stroke="#2f6b4f"/>
    <text x="56" y="448" class="name">Android auto-check</text>
    <text x="56" y="470" class="small">unknown numbers only</text>
  </g>

  <!-- 2. Extract -->
  <g>
    <rect x="250" y="236" width="170" height="178" rx="12" class="card"/>
    <text x="266" y="266" class="name">Pull out</text>
    <text x="266" y="292" class="body">• links + domains</text>
    <text x="266" y="314" class="body">• phone numbers</text>
    <text x="266" y="336" class="body">• money amounts</text>
    <line x1="266" y1="354" x2="404" y2="354" stroke="#2c3a52"/>
    <text x="266" y="376" class="mono" style="fill:#fbbf24">ezpass-tollpay.com</text>
    <text x="266" y="398" class="mono" style="fill:#fbbf24">$4.15</text>
  </g>

  <!-- 3. Collectors -->
  <g>
    <rect x="460" y="160" width="230" height="76" rx="12" class="card"/>
    <text x="476" y="190" class="name">Pattern rules</text>
    <text x="476" y="214" class="hit-amber">toll-scam wording</text>

    <rect x="460" y="252" width="230" height="76" rx="12" class="card"/>
    <text x="476" y="282" class="name">Lookalike domains</text>
    <text x="476" y="306" class="hit-red">imitates E-ZPass</text>

    <rect x="460" y="344" width="230" height="76" rx="12" class="card"/>
    <text x="476" y="374" class="name">Domain age (RDAP)</text>
    <text x="476" y="398" class="hit-red">registered 3 days ago</text>

    <rect x="460" y="436" width="230" height="76" rx="12" class="card"/>
    <text x="476" y="466" class="name">Safe Browsing / URLhaus</text>
    <text x="476" y="490" class="hit-muted">not listed yet</text>

    <text x="575" y="540" text-anchor="middle" class="small">all four run at once, 2 s timeout each</text>
  </g>

  <!-- 4. Claude -->
  <g>
    <rect x="730" y="196" width="190" height="278" rx="14" fill="#1c1833" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="746" y="226" class="name">Claude</text>
    <text x="746" y="252" class="body">reads the message</text>
    <text x="746" y="272" class="body">as untrusted data,</text>
    <text x="746" y="292" class="body">plus all the evidence</text>
    <line x1="746" y1="310" x2="904" y2="310" stroke="#3b3360"/>
    <text x="746" y="334" class="mono">risk:   <tspan style="fill:#f87171">0.93</tspan></text>
    <text x="746" y="356" class="mono">type:   <tspan style="fill:#c4b5fd">toll scam</tspan></text>
    <text x="746" y="378" class="mono">flags:  [3]</text>
    <text x="746" y="400" class="mono">advice: <tspan style="fill:#c4b5fd">don't tap</tspan></text>
    <line x1="746" y1="420" x2="904" y2="420" stroke="#3b3360"/>
    <text x="746" y="442" class="small">ignores instructions</text>
    <text x="746" y="460" class="small">hidden in the message</text>
  </g>

  <!-- 5. Decide -->
  <g>
    <rect x="960" y="160" width="200" height="170" rx="14" fill="#2a1518" stroke="#f87171" stroke-width="1.5"/>
    <text x="976" y="190" class="name">Blend + floors</text>
    <text x="976" y="214" class="small">40% evidence, 60% Claude;</text>
    <text x="976" y="232" class="small">hard evidence sets a minimum</text>
    <text x="976" y="288" class="big">93%</text>
    <rect x="1066" y="263" width="60" height="26" rx="13" fill="#f87171"/>
    <text x="1096" y="281" text-anchor="middle" class="badge">HIGH</text>
    <text x="976" y="314" class="small">final risk score</text>

    <rect x="960" y="368" width="200" height="64" rx="12" class="card"/>
    <text x="976" y="396" class="name">Reply or warning</text>
    <text x="976" y="418" class="small">SMS reply / phone alert</text>

    <rect x="960" y="468" width="200" height="64" rx="12" fill="#2a2412" stroke="#a37b1a"/>
    <text x="976" y="496" class="name">Guardian alert</text>
    <text x="976" y="518" class="small">if linked and score ≥ 80%</text>
  </g>

  <text x="40" y="592" class="small">Example: the E-ZPass text from the banner above. Blocklists may lag behind brand-new scam sites, which is why domain age and lookalike checks matter.</text>
</svg>
