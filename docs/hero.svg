<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Scam Shield</title>
  <desc id="d">A phone shows a scam text about an unpaid E-ZPass toll, with a Scam Shield warning on top: possible scam, high risk, 93 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131d36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #2dd4bf; }
      .title { font-size: 64px; font-weight: 800; fill: #f1f5f9; }
      .tag { font-size: 24px; font-weight: 600; fill: #e2e8f0; }
      .sub { font-size: 18px; fill: #94a3b8; }
      .pill { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .ntitle { font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .nsub { font-size: 12px; fill: #94a3b8; }
      .risk { font-size: 13px; font-weight: 800; fill: #f87171; letter-spacing: 0.5px; }
      .nbody { font-size: 12px; fill: #e2e8f0; }
      .msg { font-size: 13px; fill: #e5e7eb; }
      .link { font-size: 13px; fill: #93c5fd; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <circle cx="975" cy="150" r="230" fill="url(#glow)"/>

    <!-- Left: pitch -->
    <text x="64" y="104" class="eyebrow">HACKATHON PROJECT</text>
    <text x="60" y="176" class="title">Scam Shield</text>
    <text x="64" y="222" class="tag">Catches scam texts before you tap the link.</text>
    <text x="64" y="256" class="sub">Link forensics + Claude's judgment, in about five seconds.</text>

    <g transform="translate(64 296)">
      <rect width="224" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="18" r="5" fill="#2dd4bf"/>
      <text x="34" y="23" class="pill">Evidence-backed verdicts</text>
    </g>
    <g transform="translate(300 296)">
      <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="18" r="5" fill="#fbbf24"/>
      <text x="34" y="23" class="pill">Guardian alerts</text>
    </g>
    <g transform="translate(472 296)">
      <rect width="196" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="18" r="5" fill="#4ade80"/>
      <text x="34" y="23" class="pill">Contacts never read</text>
    </g>

    <!-- Right: phone -->
    <rect x="830" y="34" width="290" height="440" rx="42" fill="#05080f" stroke="#3b4a63" stroke-width="3"/>
    <rect x="844" y="48" width="262" height="420" rx="32" fill="#0f172a"/>
    <rect x="945" y="60" width="60" height="8" rx="4" fill="#1e293b"/>

    <!-- Scam Shield warning notification -->
    <rect x="856" y="84" width="238" height="112" rx="14" fill="#1f2937" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="879" cy="108" r="11" fill="#f87171"/>
    <rect x="877.5" y="101" width="3" height="9" rx="1.5" fill="#1f2937"/>
    <circle cx="879" cy="114" r="1.8" fill="#1f2937"/>
    <text x="898" y="105" class="ntitle">Possible scam</text>
    <text x="898" y="121" class="nsub">from +1 (202) 555-0143</text>
    <text x="870" y="150" class="risk">HIGH RISK · 93%</text>
    <text x="870" y="170" class="nbody">Fake E-ZPass site, registered</text>
    <text x="870" y="186" class="nbody">3 days ago. Don't tap the link.</text>

    <!-- The scam text itself -->
    <text x="860" y="226" class="nsub">+1 (202) 555-0143 · now</text>
    <rect x="856" y="236" width="222" height="128" rx="18" fill="#334155"/>
    <text x="872" y="262" class="msg">E-ZPass: You have an</text>
    <text x="872" y="281" class="msg">unpaid toll balance of</text>
    <text x="872" y="300" class="msg">$4.15. Avoid a $50 late</text>
    <text x="872" y="319" class="msg">fee by paying today:</text>
    <text x="872" y="342" class="link">ezpass-tollpay.com/pay</text>
    <path d="M872 348 q3 -3 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0" fill="none" stroke="#f87171" stroke-width="1.5"/>
  </g>
</svg>
